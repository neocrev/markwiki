<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>markwiki — Local Markdown Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237aa2f7' stroke-width='1.5' stroke-linecap='round'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/><path d='M8 7h8M8 11h6M8 15h4'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#c0caf5;height:100vh;display:flex;overflow:hidden}
a{color:#7aa2f7;text-decoration:none}
a:hover{text-decoration:underline}

/* Layout */
.sidebar{width:280px;min-width:280px;background:#1a1b2e;border-right:1px solid #24253a;display:flex;flex-direction:column;height:100vh}
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar-header{padding:16px;border-bottom:1px solid #24253a;display:flex;align-items:center;justify-content:space-between}
.sidebar-header h1{font-size:16px;font-weight:700;color:#e0e0f0}
.sidebar-header .count{font-size:12px;color:#565f89;font-weight:400}
.sidebar-search{padding:10px 12px}
.sidebar-search input{width:100%;background:#0f0f1a;border:1px solid #24253a;border-radius:6px;color:#c0caf5;padding:7px 10px;font-size:13px}
.sidebar-search input:focus{outline:none;border-color:#7aa2f7}
.note-list{flex:1;overflow-y:auto;padding:4px 0}
.note-item{padding:10px 16px;cursor:pointer;border-bottom:1px solid #0f0f1a;transition:background .1s}
.note-item:hover{background:#24253a}
.note-item.active{background:#1f204a;border-left:3px solid #7aa2f7}
.note-item .title{font-weight:600;font-size:14px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .preview{font-size:12px;color:#565f89;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .meta{font-size:11px;color:#414868;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.note-item .meta .tag{display:inline-block;padding:0 6px;border-radius:10px;font-size:10px;background:#1f204a;color:#7aa2f7;border:1px solid #24253a}
.empty-notes{padding:40px 16px;text-align:center;color:#565f89;font-size:13px}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #24253a;background:#1a1b2e;flex-wrap:wrap}
.toolbar .note-title{flex:1;background:transparent;border:none;color:#e0e0f0;font-size:18px;font-weight:700;padding:4px 8px;border-radius:4px;min-width:100px}
.toolbar .note-title:focus{outline:none;background:#0f0f1a}
.toolbar .note-title::placeholder{color:#414868;font-weight:400}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer;transition:background .15s;background:#24253a;color:#c0caf5}
.btn:hover{background:#32345a}
.btn-primary{background:#7aa2f7;color:#0f0f1a}
.btn-primary:hover{background:#89b4fa}
.btn-danger{background:#f7768e;color:#0f0f1a}
.btn-danger:hover{background:#f99}
.btn-sm{padding:4px 8px;font-size:11px}

/* Editor area */
.editor-wrap{flex:1;display:flex;overflow:hidden}
.editor-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid #24253a;min-width:0}
.preview-pane{flex:1;overflow-y:auto;padding:20px;min-width:0}
.pane-label{padding:6px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#565f89;background:#1a1b2e;border-bottom:1px solid #24253a}
textarea#editor{flex:1;width:100%;background:#0f0f1a;border:none;color:#c0caf5;padding:16px;font-family:'SF Mono','Fira Code','Cascadia Code',monospace;font-size:14px;line-height:1.6;resize:none;tab-size:2}
textarea#editor:focus{outline:none}
textarea#editor::placeholder{color:#414868}
.preview-pane img{max-width:100%;border-radius:4px}
.preview-pane pre{background:#1a1b2e;border-radius:6px;padding:12px;overflow-x:auto;margin:12px 0;border:1px solid #24253a}
.preview-pane code{font-family:'SF Mono','Fira Code',monospace;font-size:13px}
.preview-pane p code{background:#1a1b2e;padding:2px 6px;border-radius:3px}
.preview-pane h1,.preview-pane h2,.preview-pane h3,.preview-pane h4{color:#bb9af7;margin:20px 0 8px}
.preview-pane h1{border-bottom:1px solid #24253a;padding-bottom:6px}
.preview-pane h2{border-bottom:1px solid #1a1b2e;padding-bottom:4px}
.preview-pane p,.preview-pane li{line-height:1.7;margin:6px 0}
.preview-pane blockquote{border-left:3px solid #7aa2f7;padding:8px 16px;margin:12px 0;background:#1a1b2e;border-radius:0 6px 6px 0;color:#565f89}
.preview-pane table{border-collapse:collapse;margin:12px 0;width:100%}
.preview-pane th,.preview-pane td{border:1px solid #24253a;padding:6px 12px;text-align:left}
.preview-pane th{background:#1a1b2e;color:#565f89;font-size:12px;text-transform:uppercase}
.preview-pane hr{border:none;border-top:1px solid #24253a;margin:20px 0}
.preview-pane ul,.preview-pane ol{padding-left:24px}
.preview-pane a{color:#7aa2f7}
.preview-pane .empty-preview{display:flex;align-items:center;justify-content:center;height:100%;color:#565f89;font-size:14px}

/* Tags */
.tag-input-wrap{display:flex;align-items:center;gap:6px;padding:0 16px 8px;border-bottom:1px solid #24253a;background:#1a1b2e;flex-wrap:wrap}
.tag-input-wrap input{background:#0f0f1a;border:1px solid #24253a;border-radius:4px;color:#c0caf5;padding:4px 8px;font-size:12px;width:120px}
.tag-input-wrap input:focus{outline:none;border-color:#7aa2f7}
.tag-input-wrap .tag-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:10px;font-size:11px;background:#1f204a;color:#7aa2f7;border:1px solid #24253a}
.tag-input-wrap .tag-badge .remove{cursor:pointer;opacity:.5;font-size:14px;line-height:1}
.tag-input-wrap .tag-badge .remove:hover{opacity:1;color:#f7768e}

/* Status bar */
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:#1a1b2e;border-top:1px solid #24253a;font-size:11px;color:#565f89}

/* Overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#1a1b2e;border:1px solid #24253a;border-radius:12px;padding:24px;min-width:320px;max-width:90vw}
.modal h2{font-size:16px;font-weight:600;color:#e0e0f0;margin-bottom:12px}
.modal label{display:block;margin-bottom:6px;font-size:13px;color:#565f89}
.modal textarea{width:100%;min-height:120px;background:#0f0f1a;border:1px solid #24253a;border-radius:6px;color:#c0caf5;padding:10px;font-family:monospace;font-size:13px;margin-bottom:12px}
.modal textarea:focus{outline:none;border-color:#7aa2f7}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}

/* Keyboard shortcuts modal */
.shortcuts-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;margin:12px 0}
.shortcuts-grid kbd{display:inline-block;padding:2px 6px;border-radius:4px;background:#0f0f1a;border:1px solid #24253a;font-family:monospace;font-size:12px;color:#7dcfff}

/* Responsive */
@media(max-width:768px){.sidebar{width:220px;min-width:220px}.editor-wrap{flex-direction:column}.preview-pane{max-height:40vh}}
@media(max-width:480px){.sidebar{width:100%;min-width:100%;height:auto;max-height:40vh;border-right:none;border-bottom:1px solid #24253a}}
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>markwiki <span class="count" id="noteCount">0</span></h1>
    <div style="display:flex;gap:4px">
      <button class="btn btn-sm" onclick="showHelp()" title="Keyboard shortcuts (?)">?</button>
      <button class="btn btn-sm btn-primary" onclick="newNote()" title="New note (Ctrl+N)">+</button>
    </div>
  </div>
  <div class="sidebar-search">
    <input type="text" id="searchInput" placeholder="Search notes..." oninput="renderList()">
  </div>
  <div class="note-list" id="noteList"></div>
  <div style="padding:8px 12px;display:flex;gap:4px;border-top:1px solid #24253a">
    <button class="btn btn-sm" onclick="exportNotes()" title="Export all notes">Export</button>
    <button class="btn btn-sm" onclick="showImport()" title="Import notes">Import</button>
  </div>
</div>

<div class="main">
  <div class="toolbar">
    <input type="text" class="note-title" id="noteTitle" placeholder="Note title..." oninput="markDirty()">
    <div style="display:flex;gap:4px">
      <button class="btn btn-sm" id="tocBtn" onclick="toggleTOC()" title="Table of Contents">TOC</button>
      <button class="btn btn-sm btn-danger" onclick="deleteNote()" title="Delete note">Delete</button>
    </div>
  </div>
  <div class="tag-input-wrap" id="tagBar">
    <span style="font-size:12px;color:#565f89">Tags:</span>
    <div id="tagList" style="display:flex;gap:4px;flex-wrap:wrap;align-items:center"></div>
    <input type="text" id="tagInput" placeholder="+ tag" onkeydown="addTag(event)">
  </div>
  <div class="editor-wrap">
    <div class="editor-pane">
      <div class="pane-label">Editor</div>
      <textarea id="editor" placeholder="Write markdown here..." oninput="markDirty();updatePreview()"></textarea>
    </div>
    <div class="preview-pane" id="preview">
      <div class="empty-preview">Preview</div>
    </div>
  </div>
  <div class="status-bar">
    <span id="statusText">Ready</span>
    <span id="wordCount">0 words</span>
  </div>
</div>

<div id="importModal" style="display:none"></div>
<div id="helpModal" style="display:none"></div>

<script>
const STORAGE_KEY = 'markwiki_notes';
let notes = [];
let currentId = null;
let dirty = false;
let searchTerm = '';

function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    notes = raw ? JSON.parse(raw) : [];
  } catch(e) { notes = []; }
}
function saveNotes() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
}

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
  if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
  return d.toLocaleDateString();
}

function newNote() {
  const note = { id: genId(), title: 'Untitled', content: '', tags: [], created: Date.now(), updated: Date.now() };
  notes.unshift(note);
  saveNotes();
  currentId = note.id;
  dirty = false;
  renderList();
  renderNote();
  setStatus('New note created');
}

function deleteNote() {
  if (!currentId) return;
  if (!confirm('Delete this note?')) return;
  notes = notes.filter(n => n.id !== currentId);
  saveNotes();
  currentId = notes.length ? notes[0].id : null;
  dirty = false;
  renderList();
  renderNote();
  setStatus('Note deleted');
}

function getNote(id) { return notes.find(n => n.id === id); }

function renderList() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase();
  let filtered = notes;
  if (searchTerm) {
    filtered = notes.filter(n =>
      n.title.toLowerCase().includes(searchTerm) ||
      n.content.toLowerCase().includes(searchTerm) ||
      n.tags.some(t => t.toLowerCase().includes(searchTerm))
    );
  }
  const container = document.getElementById('noteList');
  const count = document.getElementById('noteCount');
  count.textContent = filtered.length;
  if (!filtered.length) {
    container.innerHTML = '<div class="empty-notes">' + (searchTerm ? 'No matching notes' : 'No notes yet. Click + to create one.') + '</div>';
    return;
  }
  container.innerHTML = '';
  filtered.forEach(n => {
    const div = el('div', 'note-item' + (n.id === currentId ? ' active' : ''));
    const preview = n.content.replace(/[#*`\[\]()>_-]/g, '').trim().slice(0, 60) || 'Empty';
    const tagHtml = n.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('');
    div.innerHTML = `<div class="title">${n.title}</div><div class="preview">${preview}</div><div class="meta"><span>${formatDate(n.updated)}</span>${tagHtml}</div>`;
    div.addEventListener('click', () => selectNote(n.id));
    container.append(div);
  });
}

function selectNote(id) {
  if (dirty) { saveCurrentNote(); }
  currentId = id;
  dirty = false;
  renderList();
  renderNote();
}

function saveCurrentNote() {
  if (!currentId) return;
  const note = getNote(currentId);
  if (!note) return;
  note.title = document.getElementById('noteTitle').value || 'Untitled';
  note.content = document.getElementById('editor').value;
  note.updated = Date.now();
  saveNotes();
  dirty = false;
  renderList();
}

function markDirty() { dirty = true; scheduleAutoSave(); }

let autoSaveTimer = null;
function scheduleAutoSave() {
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    if (dirty && currentId) {
      saveCurrentNote();
      setStatus('Auto-saved ' + new Date().toLocaleTimeString());
    }
  }, 2000);
}

function renderNote() {
  const titleEl = document.getElementById('noteTitle');
  const editor = document.getElementById('editor');
  if (!currentId) {
    titleEl.value = '';
    editor.value = '';
    document.getElementById('tagList').innerHTML = '';
    document.getElementById('preview').innerHTML = '<div class="empty-preview">Select or create a note</div>';
    return;
  }
  const note = getNote(currentId);
  if (!note) return;
  titleEl.value = note.title;
  editor.value = note.content;
  renderTags(note.tags);
  updatePreview();
}

function renderTags(tags) {
  const container = document.getElementById('tagList');
  container.innerHTML = '';
  (tags || []).forEach(t => {
    const span = el('span', 'tag-badge');
    span.innerHTML = `${t} <span class="remove" data-tag="${t}">&times;</span>`;
    container.append(span);
  });
  container.querySelectorAll('.remove').forEach(el => {
    el.addEventListener('click', () => removeTag(el.dataset.tag));
  });
}

function addTag(e) {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('tagInput');
  const tag = input.value.trim();
  if (!tag) return;
  if (!currentId) return;
  const note = getNote(currentId);
  if (!note) return;
  if (!note.tags.includes(tag)) {
    note.tags.push(tag);
    note.updated = Date.now();
    saveNotes();
    renderTags(note.tags);
    renderList();
    setStatus(`Tag: ${tag}`);
  }
  input.value = '';
}

function removeTag(tag) {
  if (!currentId) return;
  const note = getNote(currentId);
  if (!note) return;
  note.tags = note.tags.filter(t => t !== tag);
  note.updated = Date.now();
  saveNotes();
  renderTags(note.tags);
  renderList();
}

function updatePreview() {
  const content = document.getElementById('editor').value;
  const preview = document.getElementById('preview');
  document.getElementById('tocBtn').style.background = '';
  if (!content.trim()) {
    preview.innerHTML = '<div class="empty-preview">Preview</div>';
    return;
  }
  try {
    preview.innerHTML = typeof marked !== 'undefined' ? marked.parse(content) : '<div class="empty-preview">Loading marked.js...</div>';
      const words = content.trim() ? content.trim().split(/\s+/).length : 0;
      document.getElementById('wordCount').textContent = `${words} words`;
      preview.querySelectorAll('a').forEach(a => a.setAttribute('target', '_blank'));
      // Add anchor links to headings
      preview.querySelectorAll('h1,h2,h3,h4').forEach(h => {
        const id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        h.id = id;
        const anchor = document.createElement('a');
        anchor.href = '#' + id;
        anchor.className = 'heading-anchor';
        anchor.textContent = '#';
        anchor.style.cssText = 'margin-left:6px;font-size:.8em;opacity:0.3;text-decoration:none;color:#7aa2f7';
        anchor.addEventListener('mouseenter', () => anchor.style.opacity = '1');
        anchor.addEventListener('mouseleave', () => anchor.style.opacity = '0.3');
        h.prepend(anchor);
      });
    } catch(e) {
    preview.innerHTML = '<div class="empty-preview">Error rendering markdown</div>';
  }
}

function setStatus(msg) {
  document.getElementById('statusText').textContent = msg;
}

function toggleTOC() {
  const preview = document.getElementById('preview');
  const existing = preview.querySelector('.toc-wrap');
  if (existing) { existing.remove(); return; }
  const headings = preview.querySelectorAll('h1,h2,h3');
  if (!headings.length) { setStatus('No headings found'); return; }
  const wrap = document.createElement('div');
  wrap.className = 'toc-wrap';
  wrap.style.cssText = 'background:#1a1b2e;border:1px solid #24253a;border-radius:8px;padding:12px 16px;margin-bottom:16px';
  let html = '<div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#565f89;margin-bottom:8px">Contents</div>';
  headings.forEach(h => {
    const level = parseInt(h.tagName[1]);
    const text = h.textContent.replace(/^#\s*/,'');
    const id = h.id || text.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    h.id = id;
    html += `<div style="padding-left:${(level-1)*14}px;font-size:13px;padding:2px 0"><a href="#${id}" style="color:#7aa2f7;text-decoration:none">${text}</a></div>`;
  });
  wrap.innerHTML = html;
  preview.prepend(wrap);
  document.getElementById('tocBtn').style.background = '#32345a';
  wrap.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const id = a.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    });
    a.addEventListener('mouseenter', () => a.style.textDecoration = 'underline');
    a.addEventListener('mouseleave', () => a.style.textDecoration = 'none');
  });
}

function exportNotes() {
  if (!notes.length) { setStatus('No notes to export'); return; }
  const data = JSON.stringify(notes, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `markwiki_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url);
  setStatus(`Exported ${notes.length} notes`);
}

function showImport() {
  const overlay = document.getElementById('importModal');
  overlay.style.display = 'block';
  overlay.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)hideImport()">
      <div class="modal">
        <h2>Import Notes</h2>
        <label>Paste JSON data:</label>
        <textarea id="importData" placeholder='[{"id":"...","title":"...","content":"...","tags":[],"created":...,"updated":...}]'></textarea>
        <label>Or choose a file:</label>
        <input type="file" accept=".json" id="importFile" style="margin-bottom:12px;color:#c0caf5">
        <div class="modal-actions">
          <button class="btn" onclick="hideImport()">Cancel</button>
          <button class="btn btn-primary" onclick="doImport()">Import</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => { document.getElementById('importData').value = ev.target.result; };
    reader.readAsText(file);
  });
}

function hideImport() { document.getElementById('importModal').style.display = 'none'; }

function doImport() {
  const raw = document.getElementById('importData').value;
  if (!raw.trim()) { setStatus('No data to import'); return; }
  try {
    const imported = JSON.parse(raw);
    if (!Array.isArray(imported)) { setStatus('Invalid format: expected array'); return; }
    imported.forEach(n => {
      if (!n.id || !n.title) { setStatus('Invalid note format'); return; }
      if (!notes.find(ex => ex.id === n.id)) notes.push(n);
    });
    saveNotes();
    if (!currentId && notes.length) currentId = notes[0].id;
    renderList();
    renderNote();
    hideImport();
    setStatus(`Imported ${imported.length} notes`);
  } catch(e) {
    setStatus('Invalid JSON');
  }
}

function showHelp() {
  const overlay = document.getElementById('helpModal');
  overlay.style.display = 'block';
  overlay.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)hideHelp()">
      <div class="modal">
        <h2>Keyboard Shortcuts</h2>
        <div class="shortcuts-grid">
          <kbd>Ctrl+N</kbd><span>New note</span>
          <kbd>Ctrl+S</kbd><span>Save current note</span>
          <kbd>Ctrl+Shift+,</kbd><span>Delete note</span>
          <kbd>/</kbd><span>Focus search</span>
          <kbd>Escape</kbd><span>Close modals / blur</span>
          <kbd>?</kbd><span>Show this help</span>
        </div>
        <div class="modal-actions">
          <button class="btn" onclick="hideHelp()">Close</button>
        </div>
      </div>
    </div>
  `;
}

function hideHelp() { document.getElementById('helpModal').style.display = 'none'; }

function init() {
  loadNotes();
  if (notes.length) currentId = notes[0].id;
  renderList();
  renderNote();
  setStatus(`Loaded ${notes.length} notes`);

  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.key === 'n') { e.preventDefault(); newNote(); }
    if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveCurrentNote(); setStatus('Saved'); }
    if (e.ctrlKey && e.key === 'N') { e.preventDefault(); deleteNote(); }
    if (e.key === '/' && !['INPUT','TEXTAREA'].includes(e.target.tagName)) {
      e.preventDefault(); document.getElementById('searchInput').focus();
    }
    if (e.key === 'Escape') { e.target.blur(); hideImport(); hideHelp(); }
    if (e.key === '?' && !['INPUT','TEXTAREA'].includes(e.target.tagName)) { showHelp(); }
  });
}
